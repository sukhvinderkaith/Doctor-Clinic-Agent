<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClinicCare - Access Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-1">ClinicCare Portal</h2>
    <p class="text-xs text-center text-slate-500 mb-6">Doctor, Patient & Owner Access</p>

    <!-- Tab Selection -->
    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
      <button onclick="switchTab('login')" id="loginTab" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-slate-800">Login</button>
      <button onclick="switchTab('register')" id="registerTab" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="space-y-4">
      <input type="text" id="loginMobile" placeholder="Mobile Number" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input type="password" id="loginPass" placeholder="Password" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-500/30">Sign In</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="space-y-3 hidden">
      <input type="text" id="regName" placeholder="Full Name" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <input type="text" id="regMobile" placeholder="Mobile Number" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      <input type="password" id="regPass" placeholder="Password" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Select Role:</label>
        <select id="regRole" onchange="toggleFields()" class="w-full p-3 border border-slate-200 rounded-xl text-sm bg-slate-50 focus:outline-none">
          <option value="DOCTOR">Doctor</option>
          <option value="PATIENT">Patient</option>
        </select>
      </div>

      <!-- Doctor Extra Fields -->
      <div id="doctorFields" class="space-y-3">
        <input type="text" id="clinicName" placeholder="Clinic Name" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input type="text" id="location" placeholder="City / Location" class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <button onclick="handleRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-500/30">Register Account</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginTab').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-slate-800";
        document.getElementById('registerTab').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
      } else {
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerTab').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-slate-800";
        document.getElementById('loginTab').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-500";
      }
    }

    function toggleFields() {
      const role = document.getElementById('regRole').value;
      if (role === 'DOCTOR') document.getElementById('doctorFields').classList.remove('hidden');
      else document.getElementById('doctorFields').classList.add('hidden');
    }

    async function handleRegister() {
      const body = {
        name: document.getElementById('regName').value,
        mobile: document.getElementById('regMobile').value,
        password: document.getElementById('regPass').value,
        role: document.getElementById('regRole').value,
        clinicName: document.getElementById('clinicName').value,
        location: document.getElementById('location').value
      };

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        alert('Account Created Successfully! 7 Days Free Trial Active.');
        switchTab('login');
      } else {
        alert(data.message || 'Registration failed');
      }
    }

    async function handleLogin() {
      const mobile = document.getElementById('loginMobile').value;
      const password = document.getElementById('loginPass').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mobile, password })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('currentUser', JSON.stringify(data.user));
        if (data.user.role === 'ADMIN') window.location.href = '/admin.html';
        else if (data.user.role === 'DOCTOR') window.location.href = '/doctor.html';
        else window.location.href = '/patient.html';
      } else {
        alert(data.message || 'Login failed');
      }
    }
  </script>
</body>
</html>
