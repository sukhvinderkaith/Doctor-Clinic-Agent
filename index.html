<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClinicCare - Find Nearest Best Doctor & Book Token</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <nav class="border-b border-slate-800 p-4 flex justify-between items-center max-w-6xl mx-auto">
    <div class="text-xl font-black text-blue-500">ClinicCare.AI</div>
    <div class="space-x-3">
      <a href="/doctor.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl font-bold">Doctor Login</a>
      <a href="/admin.html" class="text-xs bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl font-bold">SuperAdmin</a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-6 space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-black">Find & Book Top Doctors Near You</h1>
      <p class="text-slate-400 text-sm">Select State, City or Specialty Category to locate available doctors.</p>
    </div>

    <!-- Location & Category Filter Bar -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <input type="text" id="searchState" placeholder="State (e.g., Delhi)" class="bg-slate-950 p-3 rounded-xl text-xs border border-slate-800">
      <input type="text" id="searchCity" placeholder="City (e.g., New Delhi)" class="bg-slate-950 p-3 rounded-xl text-xs border border-slate-800">
      <select id="searchCategory" class="bg-slate-950 p-3 rounded-xl text-xs border border-slate-800">
        <option value="">All Categories</option>
        <option value="General Physician">General Physician</option>
        <option value="Dentist">Dentist</option>
        <option value="Cardiologist">Cardiologist</option>
        <option value="Orthopedic">Orthopedic</option>
        <option value="Pediatrician">Pediatrician</option>
        <option value="Dermatologist">Dermatologist</option>
      </select>
      <button onclick="searchDoctors()" class="bg-blue-600 hover:bg-blue-500 font-bold text-xs rounded-xl py-3">Search</button>
    </div>

    <!-- Doctor Listings -->
    <div id="doctorList" class="space-y-4"></div>
  </div>

  <script>
    async function searchDoctors() {
      const state = document.getElementById('searchState').value;
      const city = document.getElementById('searchCity').value;
      const category = document.getElementById('searchCategory').value;

      const res = await fetch(`/api/public/doctors?state=${state}&city=${city}&category=${category}`);
      const data = await res.json();

      const container = document.getElementById('doctorList');
      container.innerHTML = '';

      if (data.doctors && data.doctors.length > 0) {
        data.doctors.forEach(doc => {
          container.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex justify-between items-center">
              <div>
                <span class="bg-blue-600/20 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-md uppercase">${doc.category}</span>
                <div class="font-bold text-lg text-white mt-1">Dr. ${doc.name}</div>
                <div class="text-xs text-slate-400 mt-1">${doc.clinicName} • ${doc.clinicAddress}, ${doc.city}, ${doc.state}</div>
                <div class="text-xs text-slate-500 mt-0.5">Email: ${doc.email}</div>
              </div>
              <button onclick="bookToken('${doc._id}', 'Dr. ${doc.name}')" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-5 py-2.5 rounded-xl font-bold">Book Token</button>
            </div>
          `;
        });
      } else {
        container.innerHTML = '<div class="text-center text-slate-500 text-xs py-8">No doctors found for selected location/category.</div>';
      }
    }

    async function bookToken(doctorId, doctorName) {
      const name = prompt(`Booking Token for ${doctorName}\nEnter Patient Name:`);
      if (!name) return;
      const phone = prompt("Enter Patient Phone Number:");
      if (!phone) return;
      const symptoms = prompt("Describe Symptoms / Issue:");

      const res = await fetch('/api/public/book-appointment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doctorId, patientName: name, patientPhone: phone, symptoms })
      });

      const data = await res.json();
      if (data.success) {
        alert(`🎉 Appointment Booked Successfully!\n\nToken Number: #${data.appointment.tokenNumber}\nEst. Wait Time: ${data.appointment.estimatedWaitMins} Mins\nAI Priority Tag: ${data.appointment.aiTriageLevel}`);
      } else {
        alert("Error: " + data.message);
      }
    }

    searchDoctors();
  </script>
</body>
</html>
