<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal | MediCare AI Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

  <nav class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <a href="/" class="flex items-center gap-2 text-xl font-black text-cyan-400">
      <i class="fa-solid fa-stethoscope"></i> Doctor Portal
    </a>
    <a href="/" class="text-sm font-semibold text-slate-400 hover:text-white"><i class="fa-solid fa-house"></i> Back to Home</a>
  </nav>

  <div class="max-w-4xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-extrabold text-white">Doctor Registration & Onboarding</h1>
      <p class="text-slate-400 text-sm mt-2">Join our AI-enabled clinic ecosystem. Registration requires SuperAdmin approval.</p>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl">
      <form onsubmit="handleDoctorSignup(event)" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Doctor Full Name *</label>
            <input type="text" placeholder="Dr. Rajesh Sharma" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-cyan-500 text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Specialization *</label>
            <select class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-cyan-500 text-sm" required>
              <option value="">Select Specialization</option>
              <option value="Cardiologist">Cardiologist</option>
              <option value="Dermatologist">Dermatologist</option>
              <option value="Pediatrician">Pediatrician</option>
              <option value="General Physician">General Physician</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Medical License Number *</label>
            <input type="text" placeholder="MCI-123456" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-cyan-500 text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-2">Email Address *</label>
            <input type="email" placeholder="doctor@clinic.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-white focus:outline-none focus:border-cyan-500 text-sm" required />
          </div>
        </div>

        <button type="submit" class="w-full py-4 rounded-xl font-bold bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-xl shadow-cyan-500/25 hover:opacity-90 transition">
          Submit Doctor Profile For Verification
        </button>
      </form>
    </div>
  </div>

  <script>
    function handleDoctorSignup(e) {
      e.preventDefault();
      alert('Doctor Registration Submitted Successfully! Pending SuperAdmin Approval.');
      window.location.href = '/';
    }
  </script>
</body>
</html>
