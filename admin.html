<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SuperAdmin Governance Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-black text-blue-500">SuperAdmin Control Panel</h1>
      <button onclick="loadAdminMetrics()" class="bg-slate-800 text-xs px-4 py-2 rounded-xl font-bold">Refresh Stats</button>
    </div>

    <!-- Revenue & Doctors Stats Overview -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs text-slate-400">Total Revenue</div>
        <div id="revTotal" class="text-2xl font-bold mt-1 text-emerald-400">₹0</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs text-slate-400">Today Revenue</div>
        <div id="revToday" class="text-2xl font-bold mt-1 text-blue-400">₹0</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs text-slate-400">Total Doctors</div>
        <div id="docTotal" class="text-2xl font-bold mt-1">0</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="text-xs text-slate-400">Pending Approvals</div>
        <div id="docPending" class="text-2xl font-bold mt-1 text-rose-400">0</div>
      </div>
    </div>

    <!-- Doctor Management List -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
      <h3 class="font-bold text-sm">All Doctors Management & Approvals</h3>
      <div id="doctorsContainer" class="space-y-3"></div>
    </div>

  </div>

  <script>
    async function loadAdminMetrics() {
      const token = sessionStorage.getItem('authToken');
      if (!token) {
        const pass = prompt("Enter SuperAdmin Login Mobile / Password Token:");
        sessionStorage.setItem('authToken', pass);
      }

      const res = await fetch('/api/admin/metrics', {
        headers: { 'Authorization': `Bearer ${sessionStorage.getItem('authToken')}` }
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('revTotal').innerText = '₹' + data.stats.totalRevenue;
        document.getElementById('revToday').innerText = '₹' + data.stats.todayRevenue;
        document.getElementById('docTotal').innerText = data.stats.totalDoctors;
        document.getElementById('docPending').innerText = data.stats.pendingDoctors;

        const div = document.getElementById('doctorsContainer');
        div.innerHTML = '';

        data.doctors.forEach(doc => {
          div.innerHTML += `
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
              <div>
                <span class="font-bold text-sm text-white">Dr. ${doc.name} (${doc.category})</span>
                <span class="ml-2 text-slate-400">${doc.city}, ${doc.state}</span>
                <p class="text-slate-500 mt-1">Email: ${doc.email} | Mobile: ${doc.mobile} | Status: <b>${doc.subscriptionStatus}</b></p>
              </div>
              <div>
                ${!doc.isApproved ? `<button onclick="approveDoctor('${doc._id}')" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold">Approve</button>` : `<span class="text-emerald-400 font-bold">Approved</span>`}
              </div>
            </div>
          `;
        });
      }
    }

    async function approveDoctor(id) {
      const token = sessionStorage.getItem('authToken');
      await fetch(`/api/admin/approve-doctor/${id}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadAdminMetrics();
    }

    loadAdminMetrics();
  </script>
</body>
</html>
