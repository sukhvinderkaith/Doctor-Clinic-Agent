<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin Control Center | MediCare AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">SuperAdmin Security Panel</h2>
        <p class="text-xs text-slate-400 mt-1">Enter credentials to manage clinic ecosystem</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Username</label>
          <input type="text" id="adminUser" placeholder="admin" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
          <input type="password" id="adminPass" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 text-sm" required />
        </div>
        <button type="submit" class="w-full py-3 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg transition">Authenticate Admin</button>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD (HIDDEN UNTIL AUTHENTICATED) -->
  <div id="adminDashboard" class="hidden">
    <nav class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2 text-indigo-400 font-bold">
        <i class="fa-solid fa-shield-halved"></i> SuperAdmin Control Hub
      </div>
      <button onclick="logoutAdmin()" class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg hover:bg-red-500/30 transition">Logout</button>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <h1 class="text-2xl font-bold text-white mb-6">Doctor Approvals & System Analytics</h1>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-lg font-bold text-white mb-4">Pending Doctor Verifications</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-400">
            <thead class="bg-slate-800 text-slate-200 text-xs uppercase">
              <tr>
                <th class="p-3">Doctor Name</th>
                <th class="p-3">Specialization</th>
                <th class="p-3">License No.</th>
                <th class="p-3">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b border-slate-800">
                <td class="p-3 text-white font-medium">Dr. Rajesh Sharma</td>
                <td class="p-3">Cardiologist</td>
                <td class="p-3">MCI-987654</td>
                <td class="p-3 flex gap-2">
                  <button onclick="alert('Doctor Approved Successfully!')" class="px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded text-xs font-bold hover:bg-emerald-500/30">Approve</button>
                  <button onclick="alert('Doctor Rejected')" class="px-3 py-1 bg-red-500/20 text-red-400 rounded text-xs font-bold hover:bg-red-500/30">Reject</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;

      if(user === "admin" && pass === "admin123") {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
      } else {
        alert("Invalid SuperAdmin Credentials! Use: admin / admin123");
      }
    }
    function logoutAdmin() {
      document.getElementById('adminDashboard').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }
  </script>
</body>
</html>
