<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Control Panel - ClinicCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Owner Admin Dashboard</h1>
        <p class="text-xs text-slate-400">Manage Registered Doctors, Subscriptions & Free Trials</p>
      </div>
      <button onclick="logout()" class="bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600/30 px-4 py-2 rounded-xl text-xs font-bold transition">Logout</button>
    </div>

    <!-- Users Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-200">All Registered Users</h2>
        <button onclick="loadUsers()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">Refresh List</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-950 text-slate-400 uppercase font-semibold">
            <tr>
              <th class="p-4">Name & Role</th>
              <th class="p-4">Clinic Name</th>
              <th class="p-4">Mobile</th>
              <th class="p-4">Location</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-center">Manage Access</th>
            </tr>
          </thead>
          <tbody id="userTable" class="divide-y divide-slate-800">
            <!-- User records will be populated here dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = '';

        // Filter out admin
        const clientUsers = users.filter(u => u.role !== 'ADMIN');

        if (clientUsers.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">No registered users found yet.</td></tr>`;
          return;
        }

        clientUsers.forEach(u => {
          let statusBadge = '';
          if (u.status === 'ACTIVE') {
            statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md font-bold">ACTIVE (PAID)</span>`;
          } else if (u.status === 'TRIAL') {
            statusBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-md font-bold">FREE TRIAL</span>`;
          } else {
            statusBadge = `<span class="bg-red-500/10 text-red-400 border border-red-500/20 px-2.5 py-1 rounded-md font-bold">${u.status}</span>`;
          }

          tbody.innerHTML += `
            <tr class="hover:bg-slate-800/40 transition">
              <td class="p-4 font-bold text-white">${u.name} <span class="block text-[10px] text-slate-500 font-normal">${u.role}</span></td>
              <td class="p-4 text-slate-300">${u.clinicName || 'N/A'}</td>
              <td class="p-4 font-mono text-blue-400">${u.mobile}</td>
              <td class="p-4 text-slate-300">${u.location || 'N/A'}</td>
              <td class="p-4">${statusBadge}</td>
              <td class="p-4 flex justify-center gap-2">
                <button onclick="updateStatus('${u.id}', 'ACTIVE')" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg font-bold">Mark Paid</button>
                <button onclick="updateStatus('${u.id}', 'BLOCKED')" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg font-bold">Block</button>
                <button onclick="extendTrial('${u.id}')" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 px-3 py-1.5 rounded-lg font-bold">+7 Days Trial</button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function updateStatus(userId, status) {
      await fetch('/api/admin/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, status })
      });
      loadUsers();
    }

    async function extendTrial(userId) {
      await fetch('/api/admin/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, days: 7 })
      });
      loadUsers();
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    loadUsers();
  </script>
</body>
</html>
